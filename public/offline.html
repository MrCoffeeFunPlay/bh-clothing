<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a2c22">
<title>BH Clothing — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f1eb; color: #2f2620; font-family: "Helvetica Neue", Arial, sans-serif; text-align: center; }
  .mark { width: 84px; height: 84px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 24px; background: #3a2c22; color: #fffaf4; font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.5px; }
  p { max-width: 320px; margin: 0 auto 22px; color: #7a6352; line-height: 1.6; }
  button { padding: 14px 28px; border: 0; border-radius: 999px; background: #3a2c22; color: #fffaf4; font: 700 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="mark">BH</div>
    <h1>You're offline.</h1>
    <p>BH needs an internet connection to show the latest pieces, prices and your bag. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
